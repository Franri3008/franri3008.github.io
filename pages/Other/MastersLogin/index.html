<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pkmn Masters Logins</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #fff;
    --ink: #1b1b1e;
    --muted: #6c6c74;
    --line: #e2e2e6;
    --pad: #ececef;
    --accent: #2f7d51;
    --yes: #2f7d51;
    --no: #b23a3a;
    --square: rgba(0, 0, 0, .045);
    --bronze: #9a5b2f;
    --silver: #6f7782;
    --gold: #a87900;
  }
  :root[data-theme="dark"] {
    --bg: #16171a;
    --card: #1e2024;
    --ink: #e8e8ea;
    --muted: #9a9aa3;
    --line: #313339;
    --pad: #26282d;
    --accent: #59b981;
    --yes: #59b981;
    --no: #e07a7a;
    --square: rgba(255, 255, 255, .05);
    --bronze: #d29462;
    --silver: #c3c9d2;
    --gold: #f0c94f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a; --card: #1e2024; --ink: #e8e8ea; --muted: #9a9aa3;
      --line: #313339; --pad: #26282d; --accent: #59b981; --yes: #59b981;
      --no: #e07a7a; --square: rgba(255, 255, 255, .05);
      --bronze: #d29462; --silver: #c3c9d2; --gold: #f0c94f;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    padding: 24px 24px 24px calc(var(--side) + 24px);
    background: var(--bg); color: var(--ink);
  }
  :root { --side: 260px; }
  svg { display: block; }

  /* Background: a tiled grid of squares drifting slowly. */
  #bg {
    position: fixed; inset: -60px; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(var(--square) 1px, transparent 1px),
      linear-gradient(90deg, var(--square) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: drift 32s linear infinite;
  }
  @keyframes drift { to { transform: translate(60px, 60px); } }
  @media (prefers-reduced-motion: reduce) { #bg { animation: none; } }

  h1 { margin: 0; font-size: 22px; text-align: left; }
  #head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  #pick, #sort {
    color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; cursor: pointer;
  }
  #pick { margin-left: auto; }
  #pick:hover, #sort:hover { border-color: var(--accent); }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px;
  }

  #side {
    position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); z-index: 3;
    overflow-y: auto; padding: 20px 16px;
    background: var(--card); border-right: 1px solid var(--line);
  }
  #side h2 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 600;
             text-transform: uppercase; letter-spacing: inherit; }
  #side details { border-top: 1px solid var(--line); padding: 8px 0; }
  #side details:first-of-type { border-top: 0; }
  #side summary {
    cursor: pointer; padding: 4px 0; list-style: none;
    display: flex; align-items: center; gap: 8px;
  }
  #side summary::-webkit-details-marker { display: none; }
  #side summary .chev { color: var(--muted); transition: transform .15s; flex: 0 0 auto; }
  #side details[open] summary .chev { transform: rotate(90deg); }
  #side summary .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  #side summary .mon { width: 32px; height: 32px; }
  #side summary { min-height: 40px; }
  #side ul { list-style: none; margin: 6px 0 4px; padding: 0 0 0 22px; font-size: 13px; }
  #side li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  #side li.pad { color: var(--muted); opacity: .5; }
  .yes { color: var(--yes); }
  .no { color: var(--no); }

  #main { min-width: 0; }
  #main > .card { width: fit-content; max-width: 100%; margin: 0 auto; }
  #wrap { overflow-x: auto; padding-bottom: 4px; }

  table { border-collapse: collapse; margin: 0 auto; }
  .mon { width: 48px; height: 48px; object-fit: contain; flex: 0 0 auto; }
  a.mon-link { display: inline-flex; }
  th, td { padding: 12px 10px; }
  tbody tr { height: 68px; }
  th.date { height: 96px; vertical-align: bottom; white-space: nowrap; font-weight: 400;
            font-size: 12px; color: var(--muted); width: 34px; text-align: center;
            position: relative; }
  /* width:0 + margin-left:50% puts the rotation pivot on the column centre, under the checkbox */
  th.date > div { transform: rotate(-45deg); transform-origin: left bottom; width: 0; margin-left: 50%; }
  th.date > .n {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    font-weight: 600; font-size: 11px;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-radius: 999px; width: 20px; height: 20px; line-height: 20px;
  }
  th.date > .n.zero { color: var(--muted); background: var(--pad); }
  th.date > .n .chk {
    position: absolute; right: -4px; bottom: -4px; width: 11px; height: 11px;
    display: grid; place-items: center; border-radius: 50%;
    background: var(--card); color: var(--accent); box-shadow: 0 0 0 1px var(--card);
  }
  th.date > .n.zero .chk { color: var(--muted); }
  th.date > .n .chk svg { width: 8px; height: 8px; }
  th.user {
    text-align: left; white-space: nowrap; padding-right: 16px; font-weight: 500;
    position: sticky; left: 0; background: var(--card); z-index: 1;
  }
  th.user > div { display: flex; align-items: center; gap: 12px; }
  tbody tr:hover th.user, tbody tr:hover td { background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
  td { text-align: center; border-top: 1px solid var(--line); }
  td.pad { background: var(--pad); }
  tbody tr:hover td.pad { background: var(--pad); }
  /* Read-only marks: the sheet is the source of truth. */
  td .mark { display: grid; place-items: center; width: 22px; height: 22px; margin: 0 auto;
             border-radius: 5px; }
  td .mark.yes { background: color-mix(in srgb, var(--yes) 16%, transparent); }
  td .mark.no { color: var(--muted); opacity: .55; }

  /* Active-streak ranks. The selected month only changes the grid; streaks always
     come from every configured event tab. */
  .rank { font-weight: 700; }
  .rank.bronze { color: var(--bronze); }
  .rank.silver { color: var(--silver); text-shadow: 0 1px 0 rgba(255, 255, 255, .35); }
  .rank.gold { color: var(--gold); text-shadow: 0 1px 0 rgba(255, 255, 255, .28); }
  .rank.rainbow {
    color: transparent;
    background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e, #3b82f6, #8b5cf6, #ef4444);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    animation: rainbow-name 4s linear infinite;
  }
  @keyframes rainbow-name { to { background-position: 220% 0; } }
  @media (prefers-reduced-motion: reduce) { .rank.rainbow { animation: none; } }

  /* Ranked rows and member cards reuse the old moving-glass treatment, tinted
     to match the active streak tier. */
  .tier.bronze { --tier-color: var(--bronze); }
  .tier.silver { --tier-color: var(--silver); }
  .tier.gold { --tier-color: var(--gold); }
  .tier {
    --tier-bg: linear-gradient(100deg,
      color-mix(in srgb, var(--tier-color) 10%, transparent),
      color-mix(in srgb, var(--tier-color) 24%, transparent) 50%,
      color-mix(in srgb, var(--tier-color) 10%, transparent));
    --tier-edge: color-mix(in srgb, var(--tier-color) 55%, transparent);
    --tier-shadow: color-mix(in srgb, var(--tier-color) 18%, transparent);
  }
  .tier.rainbow {
    --tier-color: #8b5cf6;
    --tier-bg: linear-gradient(100deg,
      color-mix(in srgb, #ef4444 18%, transparent),
      color-mix(in srgb, #f59e0b 22%, transparent),
      color-mix(in srgb, #22c55e 20%, transparent),
      color-mix(in srgb, #3b82f6 20%, transparent),
      color-mix(in srgb, #8b5cf6 20%, transparent));
  }
  .plate { position: relative; z-index: 0; }
  .tier .plate::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    border: 1px solid var(--tier-edge); border-radius: 10px;
    background:
      linear-gradient(105deg, transparent 24%, rgba(255,255,255,.18) 36%,
        rgba(255,255,255,.65) 50%, rgba(255,255,255,.18) 64%, transparent 76%) no-repeat,
      var(--tier-bg);
    background-position: -240% 0, 0 0;
    background-size: 68% 100%, 100% 100%;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.42),
      inset 0 -1px 0 var(--tier-edge), 0 4px 14px var(--tier-shadow);
    -webkit-backdrop-filter: blur(7px) saturate(115%);
    backdrop-filter: blur(7px) saturate(115%);
    animation: tier-reflection 7s ease-in-out infinite;
  }
  @keyframes tier-reflection {
    0%, 18% { background-position: -240% 0, 0 0; }
    76%, 100% { background-position: 340% 0, 0 0; }
  }
  tbody tr.tier { background: var(--tier-bg); }
  tbody tr.tier td, tbody tr.tier:hover td {
    background: transparent; border-top-color: transparent;
    box-shadow: inset 0 6px 0 var(--card), inset 0 -6px 0 var(--card);
  }
  tbody tr.tier td .mark { color: var(--tier-color); }
  tbody tr.tier td .mark.yes {
    background: color-mix(in srgb, var(--tier-color) 12%, transparent);
  }
  tbody tr.tier th.user, tbody tr.tier:hover th.user { background: var(--card); }
  tbody tr.tier th.user > .plate { padding: 4px 8px; }
  #side details.tier { padding: 8px; margin: 4px 0; }
  #side details.tier summary.plate { padding: 8px 6px; }
  #side details.tier summary .count { color: var(--tier-color); }
  @media (prefers-reduced-motion: reduce) {
    .tier .plate::before { animation: none; background-position: 35% 0, 0 0; }
  }

  /* Loading skeletons: grey shapes with a shimmer sweep, replaced when data lands. */
  .skel {
    background: linear-gradient(90deg, var(--pad) 25%,
      color-mix(in srgb, var(--ink) 8%, var(--pad)) 50%, var(--pad) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
    border-radius: 6px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  .skel.dot { width: 22px; height: 22px; margin: 0 auto; }
  .skel.bar { height: 14px; }
  .skel.circle { width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto; }
  #side .skel-row { display: flex; align-items: center; gap: 8px; min-height: 40px;
                    border-top: 1px solid var(--line); }
  #side .skel-row:first-of-type { border-top: 0; }

  /* Two-way switch: both icons always visible, a thumb slides under the active one. */
  #theme {
    position: fixed; right: 16px; bottom: 16px; z-index: 4;
    display: flex; padding: 4px; gap: 0;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; cursor: pointer;
  }
  #theme .thumb {
    position: absolute; top: 4px; left: 4px; width: 34px; height: 34px;
    border-radius: 999px; background: color-mix(in srgb, var(--accent) 22%, var(--card));
    transition: transform .28s cubic-bezier(.4, 0, .2, 1);
  }
  #theme.dark .thumb { transform: translateX(34px); }
  #theme span {
    position: relative; display: grid; place-items: center;
    width: 34px; height: 34px; color: var(--muted);
    transition: color .28s ease;
  }
  #theme:not(.dark) .s-light, #theme.dark .s-dark { color: var(--accent); }

  /* Language switch: same shape as #theme, stacked above it. Flags dim when inactive
     since their colour comes from the SVG itself, not currentColor. */
  #lang {
    position: fixed; right: 16px; bottom: 66px; z-index: 4;
    display: flex; padding: 4px; gap: 0;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; cursor: pointer;
  }
  #lang .thumb {
    position: absolute; top: 4px; left: 4px; width: 34px; height: 34px;
    border-radius: 999px; background: color-mix(in srgb, var(--accent) 22%, var(--card));
    transition: transform .28s cubic-bezier(.4, 0, .2, 1);
  }
  #lang.es .thumb { transform: translateX(34px); }
  #lang span {
    position: relative; display: grid; place-items: center;
    width: 34px; height: 34px; opacity: .4; transition: opacity .28s ease;
  }
  #lang svg { width: 20px; height: 20px; border-radius: 50%; }
  #lang:not(.es) .s-en, #lang.es .s-es { opacity: 1; }

  @media (max-width: 820px) {
    body { padding: 12px; }
    #app { display: flex; flex-direction: column; }
    #head { flex-wrap: wrap; }
    /* #main already holds title before table; pushing #side after it puts
       members last: title, table, members. */
    #side { position: static; width: auto; border-right: 0;
            border-bottom: 1px solid var(--line); margin-bottom: 12px; order: 2; }
  }
</style>

<div id="bg"></div>

<div id="app">
  <aside id="side"><h2></h2></aside>

  <div id="main">
    <div id="head">
      <div><h1>PKMN Masters Login</h1>
        <div style="font-size:11px;color:var(--muted)">v0.3.2</div></div>
      <select id="pick"><option value="all"></option></select>
      <select id="sort">
        <option value="default"></option>
        <option value="streak"></option>
      </select>
    </div>
    <div class="card"><div id="wrap"><table id="grid"></table></div></div>
  </div>
</div>

<button id="lang">
  <span class="thumb"></span><span class="s-en"></span><span class="s-es"></span>
</button>
<button id="theme">
  <span class="thumb"></span><span class="s-light"></span><span class="s-dark"></span>
</button>

<script>
const TABS = [
  { name: "September 2026 (Month 1)", gid: "0" },
  { name: "October 2026 (Month 2)", gid: "211219219" },
];
const SHEET_ID = "1tYyWIDSRMK21ErtCrt-24BM-xCcWItaUkPfWeHc5f44";
const csvUrl = gid =>
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
const svg = body => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const ICON = {
  check: svg(`<polyline points="20 6 9 17 4 12"/>`),
  cross: svg(`<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`),
  dash: svg(`<line x1="5" y1="12" x2="19" y2="12"/>`),
  chev: svg(`<polyline points="9 18 15 12 9 6"/>`),
  sun: svg(`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4
    M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>`),
  moon: svg(`<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>`),
};
const FLAG_EN = `<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#00247d"/>
  <g stroke="#fff" stroke-width="6"><path d="M0,0 L40,40 M40,0 L0,40"/></g>
  <g stroke="#cf142b" stroke-width="2.5"><path d="M0,0 L40,40 M40,0 L0,40"/></g>
  <g stroke="#fff" stroke-width="10"><path d="M20,0 V40 M0,20 H40"/></g>
  <g stroke="#cf142b" stroke-width="6"><path d="M20,0 V40 M0,20 H40"/></g></svg>`;
const FLAG_ES = `<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#AA151B"/>
  <rect y="10" width="40" height="20" fill="#F1BF00"/></svg>`;

const I18N = {
  en: { members: "Members", all: "All", month: "Month", theme: "Switch theme", lang: "Switch language",
    sort: "Sort members", default: "Default", streak: "By login streak",
    consecutiveDays: "consecutive days",
    bronze: "Bronze", silver: "Silver", gold: "Gold", rainbow: "Rainbow" },
  es: { members: "Miembros", all: "Todos", month: "Mes", theme: "Cambiar tema", lang: "Cambiar idioma",
    sort: "Ordenar miembros", default: "Predeterminado", streak: "Por racha de inicio",
    consecutiveDays: "días consecutivos",
    bronze: "Bronce", silver: "Plata", gold: "Oro", rainbow: "Arcoíris" },
};
let lang = localStorage.lang === "es" ? "es" : "en";
const t = k => I18N[lang][k];

const cell = s => s.trim().replace(/^"(.*)"$/s, "$1").replace(/""/g, '"');
const parse = t => t.trim().split(/\r?\n/).map(r => r.split(",").map(cell));
const on = v => (v || "").trim().toUpperCase() === "TRUE";

let users = [], mons = [], days = [];
const COL0 = 2;   // first user column in each CSV row

const img = name => {
  const slug = (name || "").trim().toLowerCase();
  return slug
    ? `<img class="mon" loading="lazy" alt="${slug}" title="${slug}"
        src="https://img.pokemondb.net/sprites/home/normal/${slug}.png">`
    : "";
};
const sprite = name => {
  const slug = (name || "").trim().toLowerCase();
  return slug
    ? `<a class="mon-link" href="https://pokemondb.net/pokedex/${slug}"
        target="_blank" rel="noopener">${img(slug)}</a>`
    : "";
};

// The newest day with any login is the tracking cutoff. Empty rows after it may
// represent future dates or a day whose data has not been entered yet.
const loginStreak = c => {
  const eventDays = tabRows.flatMap(rows => rows.slice(3).filter(d => d[0]).reverse());
  let latest = eventDays.length - 1;
  while (latest >= 0 && !users.some((u, i) => on(eventDays[latest][i + COL0]))) latest--;
  let streak = 0;
  while (latest >= 0 && on(eventDays[latest][c + COL0])) { streak++; latest--; }
  return streak;
};
const rankFor = streak => {
  if (streak >= 25) return "rainbow";
  if (streak >= 20) return "gold";
  if (streak >= 10) return "silver";
  if (streak >= 5) return "bronze";
  return "";
};
const rankName = c => {
  const streak = loginStreak(c);
  const rank = rankFor(streak);
  return `<span class="${rank ? `rank ${rank}` : ""}"${rank ? ` title="${t(rank)} · ${streak} ${t("consecutiveDays")}"` : ""}>${users[c]}</span>`;
};
const tierClass = c => {
  const rank = rankFor(loginStreak(c));
  return rank ? `tier ${rank}` : "";
};
const orderedColumns = () => {
  const columns = users.map((u, c) => c);
  return sort.value === "streak"
    ? columns.sort((a, b) => loginStreak(b) - loginStreak(a) || a - b)
    : columns;
};

function draw() {
  document.getElementById("grid").innerHTML = `
    <thead><tr><th></th>${days.map(d => {
      const n = users.filter((u, c) => on(d[c + COL0])).length;
      return `<th class="date">
        <span class="n${n === 0 ? " zero" : ""}">${n}<span class="chk">${ICON.check}</span></span>
        <div>${d[0]}</div></th>`;
    }).join("")}</tr></thead>
    <tbody>${orderedColumns().map(c => `<tr class="${tierClass(c)}">
      <th class="user"><div class="plate">${sprite(mons[c])}${rankName(c)}</div></th>
      ${days.map(d =>
        `<td><span class="mark ${on(d[c + COL0]) ? "yes" : "no"}">${on(d[c + COL0]) ? ICON.check : ICON.cross}</span></td>`
      ).join("")}
    </tr>`).join("")}</tbody>`;

  const open = new Set([...document.querySelectorAll("#side details[open]")].map(d => d.dataset.u));
  document.getElementById("side").innerHTML = `<h2>${t("members")}</h2>` + orderedColumns().map(c => `
    <details data-u="${users[c]}" class="${tierClass(c)}" ${open.has(users[c]) ? "open" : ""}>
      <summary class="plate">
        <span class="chev">${ICON.chev}</span>${img(mons[c])}${rankName(c)}
        <span class="count">${days.filter(d => on(d[c + COL0])).length}/${days.length}</span>
      </summary>
      <ul>${days.map(d =>
        `<li><span class="${on(d[c + COL0]) ? "yes" : "no"}">${on(d[c + COL0]) ? ICON.check : ICON.cross}</span>${d[0]}</li>`
      ).join("")}</ul>
    </details>`).join("");
}

let tabRows = [];   // parsed CSV per tab, in TABS order
const pick = document.getElementById("pick");
const sort = document.getElementById("sort");

// Skeletons shown while the sheet loads.
document.getElementById("grid").innerHTML = `
  <thead><tr><th></th>${Array.from({length: 14}, () =>
    `<th class="date"><div><span class="skel bar" style="width:52px"></span></div></th>`).join("")}</tr></thead>
  <tbody>${Array.from({length: 6}, () => `<tr>
    <th class="user"><div><span class="skel circle" style="width:48px;height:48px"></span>
      <span class="skel bar" style="width:90px"></span></div></th>
    ${Array.from({length: 14}, () => `<td><span class="skel dot"></span></td>`).join("")}
  </tr>`).join("")}</tbody>`;
document.getElementById("side").innerHTML = `<h2>${t("members")}</h2>` +
  Array.from({length: 8}, () => `<div class="skel-row">
    <span class="skel circle"></span><span class="skel bar" style="width:60%"></span>
  </div>`).join("");

// Tabs are listed oldest first but each tab already lists days newest first,
// which is what the table wants; only the tab order needs reversing.
function build() {
  const chosen = pick.value === "all"
    ? tabRows.map((rows, i) => i).reverse()
    : [Number(pick.value)];
  days = chosen.flatMap(i => tabRows[i].slice(3).filter(d => d[0])).reverse();
  draw();
}

Promise.all(TABS.map(t => fetch(csvUrl(t.gid)).then(r => r.text()).then(parse)))
  .then(tabs => {
    // A wrong gid makes Google return an HTML page; drop those tabs.
    tabRows = tabs.map(rows => rows[0]?.[0]?.startsWith("<") ? [] : rows);
    // Every tab must keep the same user column order; the fullest roster wins.
    const roster = tabs.filter(r => r.length > 2)
      .sort((a, b) => b[1].filter(Boolean).length - a[1].filter(Boolean).length)[0];
    if (!roster) return;
    users = roster[1].slice(COL0).filter(Boolean);
    mons = roster[2].slice(COL0);
    pick.innerHTML = `<option value="all">${t("all")}</option>` +
      TABS.map((tab, i) => `<option value="${i}">${tab.name}</option>`).reverse().join("");
    build();
  });

pick.onchange = build;
sort.onchange = draw;

const theme = document.getElementById("theme");
theme.querySelector(".s-light").innerHTML = ICON.sun;
theme.querySelector(".s-dark").innerHTML = ICON.moon;
const setTheme = t => {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  theme.classList.toggle("dark", dark);
};
setTheme(localStorage.theme || "");
theme.onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  localStorage.theme = dark ? "light" : "dark";
  setTheme(localStorage.theme);
};

const langBtn = document.getElementById("lang");
langBtn.querySelector(".s-en").innerHTML = FLAG_EN;
langBtn.querySelector(".s-es").innerHTML = FLAG_ES;
function applyLang() {
  document.documentElement.lang = lang;
  langBtn.classList.toggle("es", lang === "es");
  langBtn.title = langBtn.ariaLabel = t("lang");
  theme.title = theme.ariaLabel = t("theme");
  pick.ariaLabel = t("month");
  sort.ariaLabel = t("sort");
  const allOpt = pick.querySelector('option[value="all"]');
  if (allOpt) allOpt.textContent = t("all");
  sort.querySelector('option[value="default"]').textContent = t("default");
  sort.querySelector('option[value="streak"]').textContent = t("streak");
  const h2 = document.querySelector("#side h2");
  if (h2) h2.textContent = t("members");
}
applyLang();
langBtn.onclick = () => {
  lang = lang === "es" ? "en" : "es";
  localStorage.lang = lang;
  applyLang();
  if (users.length) draw();
};
</script>
